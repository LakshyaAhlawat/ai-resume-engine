<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Engine - Recruiter Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
    </style>
</head>
<body class="p-8">

    <!-- Header -->
    <header class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                AI Resume Shortlist Engine
            </h1>
            <p class="text-slate-400">Advanced Semantic Analysis & Ranking</p>
        </div>
        <div class="test-slate-500 text-sm">v1.0.0</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Controls -->
        <div class="space-y-6">
            
            <!-- Upload Section -->
            <div class="glass-panel p-6 shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-white">1. Upload Resumes</h2>
                <div class="border-2 border-dashed border-slate-600 rounded-lg p-8 text-center hover:border-blue-500 transition cursor-pointer" id="drop-zone">
                    <p class="text-slate-400 mb-2">Drag & Drop PDF/DOCX here</p>
                    <input type="file" id="fileInput" multiple class="hidden">
                    <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm">
                        Select Files
                    </button>
                </div>
                <div id="uploadStatus" class="mt-4 text-sm text-slate-300"></div>
            </div>

            <!-- JD Section -->
            <div class="glass-panel p-6 shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-white">2. Job Description</h2>
                <textarea id="jdInput" rows="8" class="w-full bg-slate-800 border border-slate-600 rounded-md p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Paste Job Description here..."></textarea>
                
                <div class="mt-4">
                    <label class="text-sm text-slate-400">Top K Candidates</label>
                    <input type="number" id="topK" value="5" class="w-16 bg-slate-800 border border-slate-600 rounded ml-2 px-2 py-1 text-center">
                </div>

                <button onclick="runShortlist()" class="w-full mt-6 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-bold py-3 rounded-md shadow-lg transition transform hover:scale-105">
                    Start AI Analysis
                </button>
            </div>

        </div>

        <!-- Right Column: Results -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Status/Loader -->
            <div id="loader" class="hidden text-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-blue-400 animate-pulse">Analyzing candidates using LLM & Vector Search...</p>
            </div>

            <!-- Results List -->
            <div id="resultsArea" class="space-y-4">
                <!-- Dynamic Content -->
            </div>

        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }

            uploadStatus.innerHTML = '<span class="text-blue-400">Uploading & Indexing...</span>';

            try {
                const res = await fetch('/api/v1/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                uploadStatus.innerHTML = `<span class="text-green-400">Successfully indexed ${data.uploaded.length} resumes.</span>`;
            } catch (err) {
                uploadStatus.innerHTML = '<span class="text-red-400">Upload failed.</span>';
                console.error(err);
            }
        });

        async function runShortlist() {
            const jd = document.getElementById('jdInput').value;
            const topK = document.getElementById('topK').value;
            
            if (!jd) {
                alert("Please enter a job description.");
                return;
            }

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultsArea').innerHTML = '';

            const formData = new FormData();
            formData.append('job_description', jd);
            formData.append('top_k', topK);

            try {
                const res = await fetch('/api/v1/shortlist', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                renderResults(data.results);
            } catch (err) {
                alert("Analysis failed.");
                console.error(err);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function renderResults(candidates) {
            const container = document.getElementById('resultsArea');
            
            if (candidates.length === 0) {
                container.innerHTML = '<div class="glass-panel p-8 text-center text-slate-400">No matching candidates found.</div>';
                return;
            }

            candidates.forEach(c => {
                const scoreColor = c.total_score >= 80 ? 'text-green-400' : (c.total_score >= 60 ? 'text-yellow-400' : 'text-red-400');
                
                const html = `
                    <div class="glass-panel p-6 border-l-4 ${c.total_score >= 80 ? 'border-green-500' : 'border-yellow-500'}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-white">${c.filename}</h3>
                                <div class="text-sm text-slate-400 mt-1">Rank #${c.rank}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-bold ${scoreColor}">${c.total_score}%</div>
                                <div class="text-xs text-slate-500">Fit Score</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div class="bg-slate-800 p-3 rounded">
                                <span class="text-xs text-slate-500 uppercase">Recommendation</span>
                                <div class="font-medium text-white">${c.summary.recommendation}</div>
                            </div>
                            <div class="bg-slate-800 p-3 rounded">
                                <span class="text-xs text-slate-500 uppercase">Semantic Match</span>
                                <div class="font-medium text-blue-300">${c.breakdown.semantic_match}%</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <p class="text-slate-300 text-sm italic">"${c.summary.reasoning}"</p>
                        </div>

                        <div class="flex flex-wrap gap-2 text-xs">
                             ${c.summary.strengths.map(s => `<span class="px-2 py-1 bg-green-900 text-green-200 rounded">${s}</span>`).join('')}
                             ${c.summary.weaknesses.map(w => `<span class="px-2 py-1 bg-red-900 text-red-200 rounded">${w}</span>`).join('')}
                        </div>
                        
                        ${c.fairness_analysis.has_sensitive_terms ? 
                            `<div class="mt-4 text-xs text-orange-400 border border-orange-900 p-2 rounded bg-orange-900/20">
                                ⚠️ Fairness Note: Contains terms ${c.fairness_analysis.terms_found.join(', ')}
                            </div>` : ''
                        }
                    </div>
                `;
                container.innerHTML += html;
            });
        }
    </script>
</body>
</html>
